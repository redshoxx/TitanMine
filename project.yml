name: TitanMine
options:
  bundleIdPrefix: com.wolfi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 2
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic

targets:
  TitanMine:
    type: application
    platform: iOS
    sources:
      - path: TitanMine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfi.titanmine
        PRODUCT_NAME: TitanMine
        INFOPLIST_FILE: TitanMine/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        SUPPORTED_PLATFORMS: iphoneos
