name: Build Android Deep Drill APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-deep-drill-v2
    paths:
      - 'android/**'
      - '.github/workflows/build-android-drill.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepDrill-Android-V2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
